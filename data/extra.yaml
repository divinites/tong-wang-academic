research:
  - title: Digital platforms and the creator economy
    text: How platforms, recommendation algorithms, sponsorship and peer recognition shape what creators produce and what users consume.
  - title: Fintech, blockchain and contracts
    text: Information and ratings in crypto-asset and peer-to-peer lending markets, smart contracts versus courts, and bank lending relationships.
  - title: The economics of AI
    text: Open models and data feedback, AI coding agents in open-source communities, compute constraints, and machine-learning methods for causal inference.

