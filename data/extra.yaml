# Short descriptions of the current courses, keyed by the course title in the English CV.
courses:
  "Large Language Models: Principles and Methods": >-
    From word embeddings and transformers to BERT and generative models, and how to use them, including
    fine-tuning, to analyse business data.
  "Economic Principles of Blockchain and Cryptocurrencies": >-
    The economics of cryptocurrencies, token offerings and decentralised finance: how they work, what they
    change for banking and corporate governance, and how regulators respond.
  "Economics of Strategy": >-
    Market structure, competitive advantage, game theory and organisational economics, applied to the
    strategic decisions firms face.
